<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System bus policy for org.hadal.Broker1.

  Any local user may open a session and ask questions — that is what makes
  Hadal a system facility rather than an admin tool. What a session may
  *do* is not decided here; it is decided per capability by polkit
  (policy/org.trench.hadal.policy). This file only governs who may speak to
  the bus name at all.
-->
<busconfig>

  <policy user="root">
    <allow own="org.hadal.Broker1"/>
  </policy>

  <policy context="default">
    <!-- Open a session and converse. -->
    <allow send_destination="org.hadal.Broker1"
           send_interface="org.hadal.Broker1"/>
    <allow send_destination="org.hadal.Broker1"
           send_interface="org.hadal.Session1"/>

    <allow send_destination="org.hadal.Broker1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.hadal.Broker1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.hadal.Broker1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>

</busconfig>
