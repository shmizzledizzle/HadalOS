# Portage configuration for HadalOS catalyst builds.
#
# This is the configuration of the system being BUILT, not the build host.
# scripts/bootstrap-buildhost.sh writes -march=native into the build host's
# own make.conf, which is correct there and would be catastrophic here: a
# stage3 compiled with native flags SIGILLs on any machine with a different
# CPU, and it fails at some arbitrary later moment rather than at boot, so the
# cause is not obvious.
#
# x86-64-v2 is the floor: it covers everything from Nehalem and Bulldozer
# onward, which is old enough that requiring it excludes nothing anyone is
# realistically installing a new distribution on in 2026, and new enough to be
# worth having.

COMMON_FLAGS="-O2 -pipe -march=x86-64-v2 -mtune=generic"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUSTFLAGS="-C target-cpu=x86-64-v2"

CHOST="x86_64-pc-linux-gnu"

USE="systemd dbus policykit elogind unicode -gnome -kde -wayland"

# Reference hardware is AMD; Intel is present because the dev laptop is Iris
# Xe and a distribution that only boots on the author's desktop is a hobby.
VIDEO_CARDS="amdgpu radeonsi intel"
INPUT_DEVICES="libinput"

ACCEPT_LICENSE="-* @FREE linux-fw-redistributable no-source-code"

# Empty by default: catalyst passes its own MAKEOPTS/jobs, and hardcoding
# them here fights whatever the build host was told to use.
GENTOO_MIRRORS="http://gentoo-mirror.flux.utah.edu"

FEATURES="parallel-fetch"
LC_MESSAGES=C.utf8
