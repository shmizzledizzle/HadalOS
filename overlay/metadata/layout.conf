# ::hadalos — HadalOS ebuild overlay

masters = gentoo

# Overlay-only packages must never be silently overridden by, nor silently
# override, ::gentoo. Anything here that shadows a Gentoo package is a
# deliberate act and should say why in its ebuild.
thin-manifests = true
sign-manifests = false
manifest-hashes = BLAKE2B SHA512
manifest-required-hashes = BLAKE2B

profile-formats = portage-2

cache-formats = md5-dict
