[workspace]
resolver = "2"
members = ["hadal-brokerd", "hadal-cli"]

# Profiles must live at the workspace root; cargo ignores them in member
# manifests.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace.package]
edition = "2021"
# Set by zbus 5.18, not by our own source. Distribution rustc is often older
# (Debian 13 ships 1.85 and fails resolution outright).
rust-version = "1.87"
license = "GPL-2.0-only"

[workspace.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
zvariant = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util"] }
futures-util = "0.3"
tracing = "0.1"
