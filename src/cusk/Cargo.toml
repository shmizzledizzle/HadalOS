[package]
name = "cusk"
version = "0.1.0"
edition = "2021"
description = "The HadalOS window manager — Wayland, floating and dynamic tiling"
license = "GPL-2.0-only"

[lib]
name = "cusk"
path = "src/lib.rs"

[[bin]]
name = "cusk"
path = "src/main.rs"

[dependencies]
# Feature set for milestone 1 only: a compositor nested in the running session.
# No DRM, no libseat, no libinput — those arrive with the tty backend, and
# pulling them in now would mean debugging seat management before anything has
# ever appeared on screen.
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "backend_egl",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
    "use_system_lib",
    # The tty backend. Enabled ahead of the backend being finished so the
    # dependency and permission story can be probed before any code depends on
    # it — discovering a missing library after writing the session handling is
    # the expensive order.
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
] }
winit = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml_edit = "0.25.13"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
fontdue = "0.9.4"
# Generates the bindings for `hadal_stage_v1`, which is HadalOS's own protocol
# and so has no crate to pull them from. Already in the dependency graph — every
# wayland-protocols crate builds through it — and it is a macro crate, so this
# adds code generation rather than a library.
wayland-scanner = "0.31"
# The runtime half of the above: the generated code names `wayland_backend`
# types directly. Not reached through smithay's re-exports because the scanner
# emits an unqualified crate path and cannot be told otherwise — which is also
# why wayland-protocols-wlr depends on it by name. Semver-unified with the copy
# smithay already pulls in, so this is a path to an existing crate rather than
# another crate.
wayland-backend = "0.3"

[profile.release]
lto = true
codegen-units = 1
