[package]
name = "hadald"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Hadal model host — Ollama-shaped inward, OpenAI-shaped outward"
license = "GPL-2.0-only"

[[bin]]
name = "hadald"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Unlike hadal-brokerd, this daemon DOES need a TLS stack — it is the component
# that talks to a remote inference endpoint. That asymmetry is deliberate and
# worth stating: the broker is privileged and speaks only plaintext loopback,
# so it links no TLS; hadald holds the TLS and the API key and holds no
# privilege whatsoever. rustls rather than OpenSSL to keep the surface in Rust.
reqwest = { version = "0.12", default-features = false, features = [
    "json", "stream", "rustls-tls", "http2",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
