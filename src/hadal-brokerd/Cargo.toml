[package]
name = "hadal-brokerd"
version = "0.1.0"
edition = "2021"
# Determined by the dependency tree, not by what this crate's own source needs:
# zbus 5.18 requires 1.87. Declaring anything lower is a promise cargo will
# refuse to keep -- Debian 13's rustc 1.85 fails resolution outright. The
# Gentoo ebuild's dev-lang/rust dependency has to match this.
rust-version = "1.87"
description = "HadalOS capability broker — org.hadal.Broker1"
license = "GPL-2.0-only"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
zvariant = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread", "macros", "process", "time", "sync", "io-util", "signal",
] }
futures-util = "0.3"
getrandom = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# default-features = false drops TLS entirely. This daemon speaks plaintext
# HTTP to 127.0.0.1 inside a network namespace with no route out; linking a
# TLS stack into the privileged component would add attack surface it has no
# use for.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
